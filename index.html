<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>B&R Inversiones — Login</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root {
  --gold: #C9A84C;
  --gold-dark: #8B6914;
  --dark: #0D0D0D;
  --dark2: #161616;
  --dark3: #1E1E1E;
  --dark4: #2A2A2A;
  --text: #F0EDE6;
  --text-muted: #8A8680;
  --text-dim: #5A5754;
  --border-dim: rgba(255,255,255,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--dark);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 2rem;
}
.bg-pattern {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
}
.bg-glow {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse 60% 60% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%);
}
.wrap {
  position: relative; z-index: 1;
  width: 100%; max-width: 420px;
}
.logo-area { text-align: center; margin-bottom: 2rem; }
.logo-area img { width: 72px; height: 72px; border-radius: 18px; object-fit: cover; box-shadow: 0 0 40px rgba(201,168,76,0.3); margin-bottom: 0.75rem; }
.logo-name { font-family: 'Syne', sans-serif; font-size: 28px; font-weight: 800; letter-spacing: -0.02em; }
.logo-name span { color: var(--gold); }
.logo-tag { font-size: 11px; color: var(--text-muted); letter-spacing: 0.1em; text-transform: uppercase; margin-top: 4px; }
.card { background: var(--dark2); border: 1px solid var(--border-dim); border-radius: 20px; padding: 2rem; }
.card-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 1.5rem; }
.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
.input-wrap { position: relative; }
.field input {
  width: 100%; height: 44px; padding: 0 14px;
  background: var(--dark3); border: 1px solid var(--border-dim);
  border-radius: 10px; color: var(--text);
  font-family: 'DM Sans', sans-serif; font-size: 14px;
  outline: none; transition: border-color 0.2s;
}
.field input:focus { border-color: var(--gold); }
.eye-btn {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: none; border: none; cursor: pointer;
  color: var(--text-muted); padding: 4px; line-height: 0;
}
.eye-btn:hover { color: var(--text); }
.btn {
  width: 100%; height: 48px; margin-top: 0.5rem;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  border: none; border-radius: 12px;
  font-family: 'Syne', sans-serif; font-size: 15px; font-weight: 600;
  color: var(--dark); cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}
.btn:hover { opacity: 0.88; }
.btn:active { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-top: 1rem; display: none; }
.msg.show { display: block; }
.msg.error { background: rgba(224,85,85,0.12); color: #F07070; border: 1px solid rgba(224,85,85,0.25); }
.msg.success { background: rgba(76,175,124,0.12); color: #70C090; border: 1px solid rgba(76,175,124,0.25); }
.hint { text-align: center; margin-top: 1rem; font-size: 12px; color: var(--text-dim); }
.footer { text-align: center; margin-top: 1.5rem; font-size: 11px; color: var(--text-dim); }
.admin-card { background: var(--dark2); border: 1px solid rgba(201,168,76,0.2); border-radius: 20px; padding: 2rem; margin-top: 1rem; display: none; }
.admin-title { font-family: 'Syne', sans-serif; font-size: 16px; font-weight: 600; margin-bottom: 1.25rem; display: flex; align-items: center; justify-content: space-between; }
.admin-badge { font-size: 11px; background: rgba(201,168,76,0.12); color: var(--gold); padding: 3px 10px; border-radius: 20px; border: 1px solid rgba(201,168,76,0.25); }
.divider { height: 1px; background: var(--border-dim); margin: 1.25rem 0; }
.user-list { font-size: 13px; }
.user-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-dim); }
.user-row:last-child { border-bottom: none; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #8B6914, #C9A84C); display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; color: #0D0D0D; flex-shrink: 0; }
.logout-btn { background: none; border: none; font-size: 12px; color: var(--text-dim); cursor: pointer; margin-top: 1rem; float: right; }
.logout-btn:hover { color: var(--text-muted); }
</style>
</head>
<body>
<div class="bg-pattern"></div>
<div class="bg-glow"></div>

<div class="wrap">
  <div class="logo-area">
    <img src="assets/logo.png" alt="B&R Inversiones">
    <div class="logo-name">B<span>&amp;R</span> Inversiones</div>
    <div class="logo-tag">S.A.S &middot; Plataforma de flipping inmobiliario</div>
  </div>

  <div class="card" id="card-login">
    <div class="card-sub">Accede a tu panel de proyectos</div>
    <div class="field">
      <label>Correo electronico</label>
      <input type="email" id="inp-email" placeholder="correo@brinversiones.co" autocomplete="email">
    </div>
    <div class="field">
      <label>Contrasena</label>
      <div class="input-wrap">
        <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password" style="padding-right:44px;">
        <button class="eye-btn" id="eye-btn" type="button">
          <svg id="eye-svg" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
    </div>
    <button class="btn" id="btn-login" type="button">Entrar al panel</button>
    <div class="msg" id="msg-login"></div>
    <div class="hint">Sin acceso? Contacta a gerencia@brinversiones.co</div>
  </div>

  <div class="admin-card" id="card-admin">
    <div class="admin-title">
      Panel de administracion
      <span class="admin-badge">Admin</span>
    </div>
    <div class="field">
      <label>Nombre completo</label>
      <input type="text" id="inp-nombre" placeholder="Juan Perez">
    </div>
    <div class="field">
      <label>Correo electronico</label>
      <input type="email" id="inp-new-email" placeholder="usuario@brinversiones.co">
    </div>
    <div class="field">
      <label>Contrasena temporal</label>
      <input type="password" id="inp-new-pass" placeholder="Minimo 6 caracteres">
    </div>
    <button class="btn" id="btn-crear" type="button">Crear usuario</button>
    <div class="msg" id="msg-admin"></div>
    <div class="divider"></div>
    <div style="font-size:13px;color:var(--text-muted);margin-bottom:0.75rem;">Usuarios del equipo</div>
    <div class="user-list" id="user-list">Cargando...</div>
    <button class="logout-btn" id="btn-logout">Cerrar sesion</button>
  </div>

  <div class="footer">B&R Inversiones S.A.S &middot; Colombia 2026</div>
</div>

<script>
// Cargar Supabase dinamicamente y arrancar cuando este listo
(function() {
  var s = document.createElement('script');
  s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload = function() { initApp(); };
  s.onerror = function() { showMsg('msg-login', 'Error cargando libreria. Verifica tu conexion.', 'error'); };
  document.head.appendChild(s);
})();

var sb = null;
var ADMIN = 'gerencia@brinversiones.co';
var SB_URL = 'https://woagfgjsbmxeizglomfh.supabase.co';
var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvYWdmZ2pzYm14ZWl6Z2xvbWZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NDY2MjQsImV4cCI6MjA5MzQyMjYyNH0.yMjM8uPSAUge5IA3Aw_euZagyqXPKk_hHLSo4GxOmwo';

function initApp() {
  sb = window.supabase.createClient(SB_URL, SB_KEY);

  // Verificar sesion activa
  sb.auth.getSession().then(function(res) {
    var session = res.data.session;
    if (!session) return;
    if (session.user.email === ADMIN) showAdmin();
    else window.location.href = 'dashboard.html';
  });

  // Boton login
  document.getElementById('btn-login').addEventListener('click', doLogin);

  // Boton crear usuario
  document.getElementById('btn-crear').addEventListener('click', crearUsuario);

  // Boton logout
  document.getElementById('btn-logout').addEventListener('click', function() {
    sb.auth.signOut().then(function() { location.reload(); });
  });

  // Ojo contrasena
  document.getElementById('eye-btn').addEventListener('click', function() {
    var inp = document.getElementById('inp-pass');
    var svg = document.getElementById('eye-svg');
    if (inp.type === 'password') {
      inp.type = 'text';
      svg.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
    } else {
      inp.type = 'password';
      svg.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  });

  // Enter key
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doLogin();
  });
}

function showMsg(id, text, type) {
  var el = document.getElementById(id);
  el.textContent = text;
  el.className = 'msg ' + type + ' show';
}

function doLogin() {
  var email = document.getElementById('inp-email').value.trim();
  var pass = document.getElementById('inp-pass').value;
  if (!email || !pass) { showMsg('msg-login', 'Completa todos los campos', 'error'); return; }
  var btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  sb.auth.signInWithPassword({ email: email, password: pass }).then(function(res) {
    if (res.error) {
      var m = res.error.message;
      if (m.indexOf('Invalid') !== -1) m = 'Correo o contrasena incorrectos.';
      if (m.indexOf('confirmed') !== -1) m = 'Email no confirmado. Contacta al admin.';
      showMsg('msg-login', m, 'error');
      btn.disabled = false; btn.textContent = 'Entrar al panel';
      return;
    }
    if (res.data.user.email === ADMIN) {
      btn.disabled = false; btn.textContent = 'Entrar al panel';
      showAdmin();
    } else {
      window.location.href = 'dashboard.html';
    }
  }).catch(function(e) {
    showMsg('msg-login', 'Error de conexion: ' + e.message, 'error');
    btn.disabled = false; btn.textContent = 'Entrar al panel';
  });
}

function showAdmin() {
  document.getElementById('card-login').style.display = 'none';
  document.getElementById('card-admin').style.display = 'block';
  cargarUsuarios();
}

function crearUsuario() {
  var nombre = document.getElementById('inp-nombre').value.trim();
  var email = document.getElementById('inp-new-email').value.trim();
  var pass = document.getElementById('inp-new-pass').value;
  if (!nombre || !email || !pass) { showMsg('msg-admin', 'Completa todos los campos', 'error'); return; }
  if (pass.length < 6) { showMsg('msg-admin', 'Contrasena minimo 6 caracteres', 'error'); return; }
  var btn = document.getElementById('btn-crear');
  btn.disabled = true; btn.textContent = 'Creando...';
  sb.auth.signUp({ email: email, password: pass, options: { data: { nombre: nombre } } }).then(function(res) {
    if (res.error) {
      showMsg('msg-admin', 'Error: ' + res.error.message, 'error');
    } else {
      showMsg('msg-admin', 'Usuario ' + nombre + ' creado correctamente.', 'success');
      document.getElementById('inp-nombre').value = '';
      document.getElementById('inp-new-email').value = '';
      document.getElementById('inp-new-pass').value = '';
      cargarUsuarios();
    }
    btn.disabled = false; btn.textContent = 'Crear usuario';
  });
}

function cargarUsuarios() {
  var lista = document.getElementById('user-list');
  lista.textContent = 'Cargando...';
  sb.from('perfiles').select('*').order('created_at', { ascending: false }).then(function(res) {
    if (res.error || !res.data || !res.data.length) {
      lista.innerHTML = '<div style="color:var(--text-dim);font-style:italic;">Sin usuarios aun.</div>';
      return;
    }
    lista.innerHTML = res.data.map(function(u) {
      return '<div class="user-row"><div class="avatar">' + (u.nombre||'U')[0].toUpperCase() + '</div>' +
        '<div><div style="color:var(--text);font-weight:500;">' + (u.nombre||'Sin nombre') + '</div>' +
        '<div style="font-size:11px;color:var(--text-dim);">' + (u.rol||'agente') + '</div></div></div>';
    }).join('');
  });
}
</script>
</body>
</html>
