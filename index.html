<style>
:root {
  --gold: #C9A84C;
  --gold-light: #E8C97A;
  --gold-dark: #8B6914;
  --dark: #0D0D0D;
  --dark2: #161616;
  --dark3: #1E1E1E;
  --dark4: #2A2A2A;
  --text: #F0EDE6;
  --text-muted: #8A8680;
  --text-dim: #5A5754;
  --success: #4CAF7C;
  --danger: #E05555;
  --warning: #E8A83C;
  --border: rgba(201,168,76,0.15);
  --border-dim: rgba(255,255,255,0.06);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'DM Sans', sans-serif;
  background: var(--dark);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
  overflow: hidden;
}

.bg-pattern {
  position: fixed; inset: 0; z-index: 0;
  background-image: 
    linear-gradient(rgba(201,168,76,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(201,168,76,0.03) 1px, transparent 1px);
  background-size: 60px 60px;
}
.bg-glow {
  position: fixed; inset: 0; z-index: 0;
  background: radial-gradient(ellipse 60% 60% at 50% 0%, rgba(201,168,76,0.08) 0%, transparent 70%);
}

.login-wrap {
  position: relative; z-index: 1;
  width: 100%; max-width: 440px;
  padding: 2rem;
}

.logo-area {
  text-align: center;
  margin-bottom: 2.5rem;
}
.logo-icon {
  width: 72px; height: 72px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  border-radius: 20px;
  display: inline-flex; align-items: center; justify-content: center;
  font-family: 'Syne', sans-serif;
  font-size: 28px; font-weight: 800;
  color: var(--dark);
  margin-bottom: 1rem;
  box-shadow: 0 0 40px rgba(201,168,76,0.3);
}
.logo-name {
  font-family: 'Syne', sans-serif;
  font-size: 32px; font-weight: 800;
  letter-spacing: -0.02em;
  color: var(--text);
}
.logo-name span { color: var(--gold); }
.logo-tagline {
  font-size: 13px; color: var(--text-muted);
  margin-top: 4px; letter-spacing: 0.08em; text-transform: uppercase;
}

.card {
  background: var(--dark2);
  border: 1px solid var(--border-dim);
  border-radius: 20px;
  padding: 2rem;
}
.card-title {
  font-family: 'Syne', sans-serif;
  font-size: 20px; font-weight: 600;
  margin-bottom: 0.25rem;
}
.card-sub { font-size: 14px; color: var(--text-muted); margin-bottom: 1.5rem; }

.tabs-auth {
  display: flex; gap: 4px;
  background: var(--dark3);
  border-radius: 10px;
  padding: 4px;
  margin-bottom: 1.5rem;
}
.tab-auth {
  flex: 1; padding: 8px;
  border: none; border-radius: 7px;
  font-family: 'DM Sans', sans-serif;
  font-size: 14px; cursor: pointer;
  color: var(--text-muted);
  background: transparent;
  transition: all 0.2s;
}
.tab-auth.active {
  background: var(--dark4);
  color: var(--text);
  font-weight: 500;
}

.field { margin-bottom: 1rem; }
.field label { display: block; font-size: 13px; color: var(--text-muted); margin-bottom: 6px; }
.field input {
  width: 100%; height: 44px;
  padding: 0 14px;
  background: var(--dark3);
  border: 1px solid var(--border-dim);
  border-radius: 10px;
  color: var(--text);
  font-family: 'DM Sans', sans-serif;
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.field input:focus { border-color: var(--gold); }

.btn-primary {
  width: 100%; height: 48px;
  background: linear-gradient(135deg, var(--gold-dark), var(--gold));
  border: none; border-radius: 12px;
  font-family: 'Syne', sans-serif;
  font-size: 15px; font-weight: 600;
  color: var(--dark);
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: opacity 0.2s, transform 0.1s;
  margin-top: 0.5rem;
}
.btn-primary:hover { opacity: 0.9; }
.btn-primary:active { transform: scale(0.98); }
.btn-primary:disabled { opacity: 0.5; cursor: not-allowed; }

.msg { 
  padding: 10px 14px; border-radius: 8px;
  font-size: 13px; margin-top: 1rem;
  display: none;
}
.msg.error { background: rgba(224,85,85,0.15); color: #F07070; border: 1px solid rgba(224,85,85,0.3); }
.msg.success { background: rgba(76,175,124,0.15); color: #70C090; border: 1px solid rgba(76,175,124,0.3); }
.msg.show { display: block; }

.footer-note {
  text-align: center;
  margin-top: 1.5rem;
  font-size: 12px;
  color: var(--text-dim);
}
</style>
</head>

<script>
const SUPABASE_URL = window.SUPABASE_URL || 'https://woagfgjsbmxeizglomfh.supabase.co';
const SUPABASE_KEY = window.SUPABASE_KEY || 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6IndvYWdmZ2pzYm14ZWl6Z2xvbWZoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc4NDY2MjQsImV4cCI6MjA5MzQyMjYyNH0.yMjM8uPSAUge5IA3Aw_euZagyqXPKk_hHLSo4GxOmwo';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function checkSession() {
  const { data } = await supabase.auth.getSession();
  if (data.session) window.location.href = 'dashboard.html';
}
checkSession();

function switchAuth(tab) {
  document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('form-register').style.display = tab === 'register' ? 'block' : 'none';
  document.querySelectorAll('.tab-auth').forEach((t, i) => {
    t.classList.toggle('active', (i === 0 && tab === 'login') || (i === 1 && tab === 'register'));
  });
}

function showMsg(id, text, type) {
  const el = document.getElementById(id);
  el.textContent = text;
  el.className = `msg ${type} show`;
}

async function doLogin() {
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-pass').value;
  if (!email || !pass) return showMsg('msg-login', 'Completa todos los campos', 'error');
  const btn = document.getElementById('btn-login');
  btn.disabled = true; btn.textContent = 'Ingresando...';
  const { error } = await supabase.auth.signInWithPassword({ email, password: pass });
  if (error) {
    showMsg('msg-login', 'Credenciales incorrectas. Verifica tu correo y contraseña.', 'error');
    btn.disabled = false; btn.textContent = 'Entrar al panel';
  } else {
    window.location.href = 'dashboard.html';
  }
}

async function doRegister() {
  const nombre = document.getElementById('reg-nombre').value.trim();
  const email = document.getElementById('reg-email').value.trim();
  const pass = document.getElementById('reg-pass').value;
  if (!nombre || !email || !pass) return showMsg('msg-reg', 'Completa todos los campos', 'error');
  if (pass.length < 6) return showMsg('msg-reg', 'La contraseña debe tener al menos 6 caracteres', 'error');
  const btn = document.getElementById('btn-reg');
  btn.disabled = true; btn.textContent = 'Creando cuenta...';
  const { data, error } = await supabase.auth.signUp({ email, password: pass, options: { data: { nombre } } });
  if (error) {
    showMsg('msg-reg', error.message, 'error');
    btn.disabled = false; btn.textContent = 'Crear cuenta';
  } else {
    showMsg('msg-reg', 'Cuenta creada. Revisa tu email para confirmar.', 'success');
    btn.textContent = 'Revisa tu email';
  }
}

document.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    if (document.getElementById('form-login').style.display !== 'none') doLogin();
    else doRegister();
  }
});
</script>
</body>
</html>
